<!DOCTYPE html>
<html lang="en">
<head>
  <include src="_partials/meta-base.html"></include>
  <title>JSON Formatter — HTML Tools</title>
  <meta name="description" content="Prettify, minify, and validate JSON instantly in your browser. Features syntax highlighting and an interactive collapsible tree view.">
  <link rel="canonical" href="https://tools.mazipan.space/json-formatter">
  <meta property="og:title" content="JSON Formatter — HTML Tools">
  <meta property="og:description" content="Prettify, minify, and validate JSON instantly in your browser. Features syntax highlighting and an interactive collapsible tree view.">
  <meta property="og:url" content="https://tools.mazipan.space/json-formatter">
  <meta name="twitter:title" content="JSON Formatter — HTML Tools">
  <meta name="twitter:description" content="Prettify, minify, and validate JSON instantly in your browser. Features syntax highlighting and an interactive collapsible tree view.">
  <include src="_partials/meta-social.html"></include>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <include src="_partials/head-fonts.html"></include>
  <link rel="stylesheet" href="styles.css">
  <style>
    mark.sh { background: #92400e; color: #fef3c7; border-radius: 2px; padding: 0 1px; }
    mark.sh.sh-active { background: #f59e0b; color: #000; border-radius: 2px; padding: 0 1px; }
    #search-input:-webkit-autofill,
    #search-input:autofill {
      -webkit-box-shadow: 0 0 0 1000px #111827 inset;
      box-shadow: 0 0 0 1000px #111827 inset;
      -webkit-text-fill-color: #e5e7eb;
      caret-color: #e5e7eb;
    }
  </style>
  <include src="_partials/head-theme.html"></include>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">

  <!-- Site header -->
  <header class="border-b border-gray-800 px-6 py-4">
    <div class="max-w-[1100px] mx-auto flex items-center gap-3">
      <a href="index.html" class="no-underline text-white font-bold text-lg tracking-tight hover:text-blue-400 transition-colors">
        HTML Tools
      </a>
      <span class="text-gray-700">/</span>
      <span class="text-gray-400 text-sm flex items-center gap-1.5">
        🗂️ JSON Formatter
      </span>
    </div>
  </header>

  <div class="max-w-[1100px] mx-auto w-full flex-1 py-8 px-6">

    <header class="mb-7">
      <h1 class="text-3xl font-bold text-white flex items-center gap-3">🗂️ JSON Formatter</h1>
      <p class="mt-1.5 text-sm text-gray-500">Prettify, minify, and validate JSON instantly in your browser.</p>
    </header>

    <!-- Toolbar -->
    <div class="flex flex-wrap gap-2 items-center mb-4">
      <button onclick="format()" class="btn btn-primary">Prettify</button>
      <button onclick="minify()" class="btn btn-secondary">Minify</button>
      <button onclick="clearAll()" class="btn btn-danger">Clear</button>
    </div>

    <!-- Panels -->
    <div class="grid grid-cols-2 gap-4 max-md:grid-cols-1">

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Input</label>
        </div>
        <textarea id="input"
                  placeholder="Paste JSON here..."
                  spellcheck="false"
                  oninput="onInput()"
                  class="w-full h-[500px] min-h-[500px] rounded-lg border border-gray-700 bg-gray-900
                         text-gray-200 font-mono text-[0.8rem] leading-relaxed p-4 resize-y outline-none
                         focus:border-blue-400 transition-colors"></textarea>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Output</label>
          <div class="flex gap-1 items-center">
            <button onclick="copyOutput()" class="btn btn-secondary btn-sm">Copy</button>
            <span class="w-px h-3 bg-gray-700 mx-0.5"></span>
            <button id="btn-tree" onclick="setView('tree')" class="btn btn-sm btn-active">Tree</button>
            <button id="btn-raw" onclick="setView('raw')" class="btn btn-secondary btn-sm">Raw</button>
            <span class="w-px h-3 bg-gray-700 mx-0.5"></span>
            <button onclick="openSearch()" title="Search (Ctrl+F / ⌘F)" class="btn btn-secondary btn-sm">Search</button>
          </div>
        </div>

        <!-- Search bar -->
        <div id="search-bar" style="display:none"
             class="flex items-center gap-1.5 mb-2 px-2 py-1.5 rounded-lg border border-gray-700 bg-gray-900/70">
          <input id="search-input" type="text" placeholder="Search keys & values…" spellcheck="false" autocomplete="off"
                 oninput="runSearch()"
                 onkeydown="onSearchKey(event)"
                 class="flex-1 bg-transparent text-gray-200 font-mono text-[0.78rem] outline-none placeholder-gray-600 min-w-0">
          <span id="search-count" class="text-[0.7rem] text-gray-500 whitespace-nowrap select-none"></span>
          <button onclick="navigateSearch(-1)" title="Previous (Shift+Enter)" class="btn btn-secondary btn-sm">↑</button>
          <button onclick="navigateSearch(1)" title="Next (Enter)" class="btn btn-secondary btn-sm">↓</button>
          <button onclick="closeSearch()" title="Close (Esc)"
                  class="btn btn-danger btn-sm
                         bg-gray-800 border-gray-600 text-gray-400 hover:border-red-400 hover:text-red-400">✕</button>
        </div>

        <div id="output"
             class="w-full h-[500px] min-h-[500px] rounded-lg border border-gray-700 bg-gray-900
                    font-mono text-[0.8rem] leading-relaxed p-4 overflow-auto resize-y"></div>
      </div>

    </div>

    <div id="status" class="mt-2.5 text-xs text-gray-500 min-h-[18px]"></div>
  </div>

  <script src="json-utils.js"></script>
  <script>
    const inputEl  = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');

    let currentView   = 'tree';
    let lastParsed    = null;
    let lastFormatted = '';

    // ── View toggle ──────────────────────────────────────────────
    function setView(v) {
      currentView = v;
      const treeBtn = document.getElementById('btn-tree');
      const rawBtn  = document.getElementById('btn-raw');
      treeBtn.classList.toggle('btn-active', v === 'tree');
      treeBtn.classList.toggle('btn-secondary', v !== 'tree');
      rawBtn.classList.toggle('btn-active', v === 'raw');
      rawBtn.classList.toggle('btn-secondary', v !== 'raw');
      renderOutput();
    }

    function renderOutput() {
      if (!lastParsed && lastFormatted === '') { outputEl.innerHTML = ''; return; }
      if (currentView === 'tree' && lastParsed !== null) {
        outputEl.className = outputEl.className.replace('whitespace-pre', '');
        outputEl.innerHTML = '';
        const root = document.createElement('div');
        root.className = 'tree-root';
        const counter = { n: 1 };
        root.appendChild(buildTree(lastParsed, null, true, counter));
        outputEl.appendChild(root);
      } else {
        if (!outputEl.className.includes('whitespace-pre')) {
          outputEl.className += ' whitespace-pre';
        }
        outputEl.innerHTML = highlightRaw(lastFormatted);
      }
      const bar = document.getElementById('search-bar');
      if (bar && bar.style.display !== 'none') runSearch();
    }

    // ── Format / Minify ──────────────────────────────────────────
    function format() {
      const raw = inputEl.value.trim();
      if (!raw) { lastParsed = null; lastFormatted = ''; renderOutput(); setStatus(''); return; }
      try {
        const { value, fixed } = tolerantParse(raw);
        lastParsed    = value;
        lastFormatted = JSON.stringify(value, null, 2);
        outputEl.classList.remove('border-red-500');
        outputEl.classList.add('border-gray-700');
        renderOutput();
        const suffix = fixed ? ' · auto-fixed' : '';
        setStatus(`Valid JSON · ${countKeys(lastParsed)} keys${suffix}`, 'ok');
      } catch (e) {
        lastParsed = null; lastFormatted = '';
        outputEl.classList.remove('border-gray-700');
        outputEl.classList.add('border-red-500');
        outputEl.className += ' whitespace-pre-wrap';
        outputEl.textContent = e.message;
        setStatus(e.message, 'err');
      }
    }

    function minify() {
      const raw = inputEl.value.trim();
      if (!raw) return;
      try {
        const { value, fixed } = tolerantParse(raw);
        lastParsed    = value;
        lastFormatted = JSON.stringify(value);
        setView('raw');
        setStatus(fixed ? 'Minified · auto-fixed' : 'Minified', 'ok');
      } catch (e) {
        outputEl.textContent = e.message;
        setStatus(e.message, 'err');
      }
    }

    // ── Tree builder ─────────────────────────────────────────────
    function buildTree(value, key, isLast, counter) {
      const node = document.createElement('div');
      node.className = 'tree-node';

      if (value === null || typeof value !== 'object') {
        const row = document.createElement('div');
        row.className = 'tree-row';
        row.innerHTML =
          `<span class="line-num">${counter.n++}</span>` +
          '<span class="toggle-btn leaf">▶</span>' +
          (key !== null ? `<span class="json-key">"${escHtml(key)}"</span><span class="json-punct">: </span>` : '') +
          primitiveHtml(value) +
          (isLast ? '' : '<span class="tree-comma">,</span>');
        node.appendChild(row);
        return node;
      }

      const isArray  = Array.isArray(value);
      const keys     = isArray ? value.map((_, i) => i) : Object.keys(value);
      const openB    = isArray ? '[' : '{';
      const closeB   = isArray ? ']' : '}';
      const previewLabel = isArray
        ? `${keys.length} item${keys.length !== 1 ? 's' : ''}`
        : `${keys.length} key${keys.length !== 1 ? 's' : ''}`;

      const headerRow = document.createElement('div');
      headerRow.className = 'tree-row';
      headerRow.style.cursor = 'pointer';

      const toggleBtn = document.createElement('span');
      toggleBtn.className = 'toggle-btn';
      toggleBtn.textContent = '▼';

      const keyHtml = key !== null
        ? `<span class="json-key">"${escHtml(String(key))}"</span><span class="json-punct">: </span>`
        : '';

      headerRow.innerHTML =
        `<span class="line-num">${counter.n++}</span>` +
        keyHtml +
        `<span class="json-punct">${openB}</span>` +
        `<span class="collapsed-preview" style="display:none"> ${previewLabel} </span>`;
      headerRow.insertBefore(toggleBtn, headerRow.children[1]);
      node.appendChild(headerRow);

      const childrenEl = document.createElement('div');
      childrenEl.className = 'tree-children';
      keys.forEach((k, i) => {
        childrenEl.appendChild(buildTree(isArray ? value[k] : value[k], isArray ? null : k, i === keys.length - 1, counter));
      });
      node.appendChild(childrenEl);

      const footerRow = document.createElement('div');
      footerRow.className = 'tree-row';
      footerRow.innerHTML =
        `<span class="line-num">${counter.n++}</span>` +
        '<span class="toggle-btn leaf">▶</span>' +
        `<span class="json-punct">${closeB}</span>` +
        (isLast ? '' : '<span class="tree-comma">,</span>');
      node.appendChild(footerRow);

      const collapsedPreview = headerRow.querySelector('.collapsed-preview');
      let collapsed = false;
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        collapsed = !collapsed;
        toggleBtn.textContent             = collapsed ? '▶' : '▼';
        childrenEl.style.display          = collapsed ? 'none' : '';
        footerRow.style.display           = collapsed ? 'none' : '';
        collapsedPreview.style.display    = collapsed ? 'inline' : 'none';
        if (collapsed) {
          collapsedPreview.textContent = ` ${previewLabel} ${closeB}${isLast ? '' : ','}`;
        }
      });
      headerRow.addEventListener('click', () => toggleBtn.click());

      return node;
    }

    // ── Raw syntax highlight ─────────────────────────────────────
    function highlightRaw(json) {
      const highlighted = escHtml(json).replace(
        /("(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?)|(\b(?:true|false|null)\b)|(-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        (m) => {
          if (m.endsWith(':'))               return `<span class="json-key">${m}</span>`;
          if (m.startsWith('"'))             return `<span class="json-string">${m}</span>`;
          if (m === 'true' || m === 'false') return `<span class="json-bool">${m}</span>`;
          if (m === 'null')                  return `<span class="json-null">${m}</span>`;
          return `<span class="json-number">${m}</span>`;
        }
      );
      const lines = highlighted.split('\n');
      const pad   = String(lines.length).length;
      return lines.map((line, i) =>
        `<span class="line-num">${String(i + 1).padStart(pad)}</span>${line}`
      ).join('\n');
    }

    // ── Helpers ──────────────────────────────────────────────────
    function primitiveHtml(v) {
      if (v === null)             return `<span class="json-null">null</span>`;
      if (typeof v === 'boolean') return `<span class="json-bool">${v}</span>`;
      if (typeof v === 'number')  return `<span class="json-number">${v}</span>`;
      return `<span class="json-string">"${escHtml(v)}"</span>`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function countKeys(obj, d = 0) {
      if (d > 5 || typeof obj !== 'object' || obj === null) return 0;
      const keys = Object.keys(obj);
      return keys.length + keys.reduce((s, k) => s + countKeys(obj[k], d + 1), 0);
    }

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className   = type === 'ok'
        ? 'mt-2.5 text-xs min-h-[18px] text-green-400'
        : type === 'err'
          ? 'mt-2.5 text-xs min-h-[18px] text-red-400'
          : 'mt-2.5 text-xs min-h-[18px] text-gray-500';
    }

    function copyOutput() {
      if (!lastFormatted) return;
      navigator.clipboard.writeText(lastFormatted).then(() => {
        setStatus('Copied to clipboard!', 'ok');
        setTimeout(() => setStatus(''), 2000);
      });
    }

    function clearAll() {
      inputEl.value = '';
      lastParsed    = null;
      lastFormatted = '';
      outputEl.innerHTML = '';
      outputEl.classList.remove('border-red-500', 'whitespace-pre', 'whitespace-pre-wrap');
      outputEl.classList.add('border-gray-700');
      setStatus('');
      closeSearch();
    }

    let debounceTimer;
    function onInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(format, 300);
    }

    // ── Search ───────────────────────────────────────────────────
    let searchMatches = [];
    let searchCurrent = -1;

    function openSearch() {
      const bar = document.getElementById('search-bar');
      bar.style.display = 'flex';
      document.getElementById('search-input').select();
      document.getElementById('search-input').focus();
    }

    function closeSearch() {
      const bar = document.getElementById('search-bar');
      if (!bar) return;
      bar.style.display = 'none';
      clearSearchHighlights();
      searchMatches = [];
      searchCurrent = -1;
      document.getElementById('search-count').textContent = '';
    }

    function clearSearchHighlights() {
      outputEl.querySelectorAll('mark.sh').forEach(mark => {
        const parent = mark.parentNode;
        if (parent) {
          parent.replaceChild(document.createTextNode(mark.textContent), mark);
          parent.normalize();
        }
      });
    }

    function runSearch() {
      clearSearchHighlights();
      searchMatches = [];
      searchCurrent = -1;

      const query = document.getElementById('search-input').value;
      const countEl = document.getElementById('search-count');

      if (!query) { countEl.textContent = ''; return; }

      // In tree view, expand all collapsed nodes so all text is visible and searchable
      if (currentView === 'tree') {
        outputEl.querySelectorAll('.toggle-btn:not(.leaf)').forEach(btn => {
          if (btn.textContent === '▶') btn.click();
        });
      }

      const lowerQuery = query.toLowerCase();
      const walker = document.createTreeWalker(outputEl, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (node.parentElement && node.parentElement.classList.contains('line-num')) {
            return NodeFilter.FILTER_REJECT;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });

      const textNodes = [];
      let node;
      while ((node = walker.nextNode())) textNodes.push(node);

      textNodes.forEach(textNode => {
        const text = textNode.textContent;
        const lowerText = text.toLowerCase();
        let idx = lowerText.indexOf(lowerQuery);
        if (idx === -1) return;

        const frag = document.createDocumentFragment();
        let lastIdx = 0;

        while (idx !== -1) {
          if (idx > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, idx)));
          const mark = document.createElement('mark');
          mark.className = 'sh';
          mark.textContent = text.slice(idx, idx + query.length);
          frag.appendChild(mark);
          searchMatches.push(mark);
          lastIdx = idx + query.length;
          idx = lowerText.indexOf(lowerQuery, lastIdx);
        }

        if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        textNode.parentNode.replaceChild(frag, textNode);
      });

      if (searchMatches.length === 0) {
        countEl.textContent = 'No matches';
        countEl.className = 'text-[0.7rem] text-red-400 whitespace-nowrap select-none';
        return;
      }

      countEl.className = 'text-[0.7rem] text-gray-500 whitespace-nowrap select-none';
      searchCurrent = 0;
      updateSearchActive();
    }

    function updateSearchActive() {
      searchMatches.forEach((m, i) => {
        m.className = i === searchCurrent ? 'sh sh-active' : 'sh';
      });
      const active = searchMatches[searchCurrent];
      if (active) active.scrollIntoView({ block: 'center', behavior: 'smooth' });
      document.getElementById('search-count').textContent =
        `${searchCurrent + 1} / ${searchMatches.length}`;
    }

    function navigateSearch(dir) {
      if (searchMatches.length === 0) return;
      searchCurrent = (searchCurrent + dir + searchMatches.length) % searchMatches.length;
      updateSearchActive();
    }

    function onSearchKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        navigateSearch(e.shiftKey ? -1 : 1);
      } else if (e.key === 'Escape') {
        closeSearch();
      }
    }

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        openSearch();
      }
    });

    inputEl.focus();
  </script>
  </div>

  <footer class="max-w-[1100px] mx-auto w-full py-8 px-6 border-t border-gray-800 text-center text-sm text-gray-600">
    &copy; <span id="year"></span> Irfan Maulana &amp; Claude<br><span id="deploy-time"></span>
  </footer>

  <include src="_partials/footer-script.html"></include>
</body>
</html>
