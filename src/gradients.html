  // ── CSS conversion ───────────────────────────────────────────
  const DIR_MAP = {
    'bg-gradient-to-r':  'to right',
    'bg-gradient-to-l':  'to left',
    'bg-gradient-to-t':  'to top',
    'bg-gradient-to-b':  'to bottom',
    'bg-gradient-to-tr': 'to top right',
    'bg-gradient-to-tl': 'to top left',
    'bg-gradient-to-br': 'to bottom right',
    'bg-gradient-to-bl': 'to bottom left',
  };

  function toCss(g) {
    // Parse color stop tokens (skip any extra bg-* tokens in colors)
    const parts = g.colors.split(/\s+/).filter(p => !p.startsWith('bg-'));
    const from = parts.find(p => p.startsWith('from-'))?.slice(5);
    const via  = parts.find(p => p.startsWith('via-'))?.slice(4);
    const to   = parts.find(p => p.startsWith('to-'))?.slice(3);
    const stops = via
      ? `${resolveColor(from)}, ${resolveColor(via)}, ${resolveColor(to)}`
      : `${resolveColor(from)}, ${resolveColor(to)}`;
    // Standard direction
    if (DIR_MAP[g.direction]) return `linear-gradient(${DIR_MAP[g.direction]}, ${stops})`;
    // Arbitrary direction: bg-[conic-gradient(...)] / bg-[radial-gradient(...)]
    const m = g.direction.match(/^bg-\[(.+)\]$/);
    if (m) return m[1].replace(/_/g, ' ').replace(/var\(--tw-gradient-stops\)/, stops);
    return `linear-gradient(to right, ${stops})`;
  }

  function toTailwind(g) {
    const clean = g.colors.replace(/\s*bg-gradient-to-\S+\s*/g, ' ').trim();
    return `${g.direction} ${clean}`;
  }

  // ── Canvas gradient drawing ──────────────────────────────────
  function splitArgs(str) {
    const parts = [];
    let depth = 0, start = 0;
    for (let i = 0; i < str.length; i++) {
      if (str[i] === '(') depth++;
      else if (str[i] === ')') depth--;
      else if (str[i] === ',' && depth === 0) {
        parts.push(str.slice(start, i).trim());
        start = i + 1;
      }
    }
    parts.push(str.slice(start).trim());
    return parts;
  }

  function parsePos(pos, w, h) {
    let x = w / 2, y = h / 2;
    for (const p of pos.trim().split(/\s+/)) {
      if (p === 'left')   x = 0;
      if (p === 'right')  x = w;
      if (p === 'top')    y = 0;
      if (p === 'bottom') y = h;
    }
    return [x, y];
  }

  function addColorStops(grad, stopParts) {
    const stops = stopParts.map(s => {
      const m = s.match(/^(.+?)\s+([\d.]+)%\s*$/);
      return m ? { color: m[1].trim(), offset: parseFloat(m[2]) / 100 }
               : { color: s.trim(), offset: null };
    }).filter(s => s.color);
    if (!stops.length) return;
    if (stops[0].offset === null)               stops[0].offset = 0;
    if (stops[stops.length - 1].offset === null) stops[stops.length - 1].offset = 1;
    for (let i = 1; i < stops.length - 1; i++) {
      if (stops[i].offset !== null) continue;
      let j = i + 1;
      while (j < stops.length - 1 && stops[j].offset === null) j++;
      const lo = stops[i - 1].offset, hi = stops[j].offset, n = j - i + 1;
      for (let k = i; k < j; k++) stops[k].offset = lo + (hi - lo) * (k - i + 1) / n;
    }
    stops.forEach(s => grad.addColorStop(Math.max(0, Math.min(1, s.offset)), s.color));
  }

  function drawCssGradient(ctx, css, w, h) {
    let m;

    m = css.match(/^linear-gradient\((.+)\)$/s);
    if (m) {
      const parts = splitArgs(m[1]);
      const first = parts[0];
      let x0, y0, x1, y1, stopParts;
      if (/^to\s|^\d/.test(first)) {
        stopParts = parts.slice(1);
        if (first.startsWith('to ')) {
          const d = first.slice(3).trim();
          const dirs = {
            'right':        [0, 0, w, 0],
            'left':         [w, 0, 0, 0],
            'bottom':       [0, 0, 0, h],
            'top':          [0, h, 0, 0],
            'bottom right': [0, 0, w, h],
            'bottom left':  [w, 0, 0, h],
            'top right':    [0, h, w, 0],
            'top left':     [w, h, 0, 0],
          };
          [x0, y0, x1, y1] = dirs[d] ?? [0, 0, w, 0];
        } else {
          const rad = parseFloat(first) * Math.PI / 180;
          const len = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));
          x0 = w/2 - Math.sin(rad)*len/2; y0 = h/2 + Math.cos(rad)*len/2;
          x1 = w/2 + Math.sin(rad)*len/2; y1 = h/2 - Math.cos(rad)*len/2;
        }
      } else {
        stopParts = parts;
        [x0, y0, x1, y1] = [0, 0, 0, h];
      }
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      addColorStops(grad, stopParts);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      return;
    }

    m = css.match(/^radial-gradient\((.+)\)$/s);
    if (m) {
      const parts = splitArgs(m[1]);
      let cx = w/2, cy = h/2, stopParts;
      if (parts[0].includes('at ')) {
        [cx, cy] = parsePos(parts[0].slice(parts[0].indexOf('at ') + 3), w, h);
        stopParts = parts.slice(1);
      } else {
        stopParts = parts;
      }
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.sqrt(w*w + h*h));
      addColorStops(grad, stopParts);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      return;
    }

    m = css.match(/^conic-gradient\((.+)\)$/s);
    if (m) {
      const parts = splitArgs(m[1]);
      let cx = w/2, cy = h/2, stopParts;
      if (parts[0].startsWith('at ')) {
        [cx, cy] = parsePos(parts[0].slice(3), w, h);
        stopParts = parts.slice(1);
      } else {
        stopParts = parts;
      }
      // Fallback to radial when conic is unsupported; visually different but best-effort.
      const grad = ctx.createConicGradient
        ? ctx.createConicGradient(0, cx, cy)
        : ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) / 2);
      addColorStops(grad, stopParts);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      return;
    }

    throw new Error('unrecognised gradient');
  }

  function exportPng(g, btn) {
    const slug = g.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const w = 1200, h = 630;
    btn.textContent = '…';
    btn.disabled = true;

    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');

    try {
      drawCssGradient(ctx, toCss(g), w, h);
    } catch (_) {
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(0, 0, w, h);
    }

    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.download = `${slug}.png`;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      showToast('PNG exported!');
      btn.textContent = 'PNG';
      btn.disabled = false;
    }, 'image/png');
  }

  // ── Render ───────────────────────────────────────────────────
  function createCard(g) {
    const css = toCss(g);
    const card = document.createElement('div');
    card.className = 'rounded-xl overflow-hidden border border-gray-800 hover:border-gray-600 transition-all duration-150 bg-gray-900';

    const preview = document.createElement('div');
    preview.className = 'h-36 w-full';
    preview.style.background = css;

    const footer = document.createElement('div');
    footer.className = 'px-3 py-2.5 border-t border-gray-800 flex items-center justify-between gap-2';

    const name = document.createElement('span');
    name.className = 'text-xs font-medium text-gray-300 truncate';
    name.textContent = g.name;

    const btns = document.createElement('div');
    btns.className = 'flex gap-1 shrink-0';

    const btnCss = btn('CSS', () => copyCss(g));
    const btnTw  = btn('TW',  () => copyTailwind(g));
    const btnPng = btn('PNG', null);
    btnPng.onclick = () => exportPng(g, btnPng);

    btns.append(btnCss, btnTw, btnPng);
    footer.append(name, btns);
    card.append(preview, footer);
    return card;
  }

  function btn(label, handler) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = 'btn btn-secondary btn-sm';
    if (handler) b.onclick = handler;
    return b;
  }

  // Init
  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();
  GRADIENTS_CORE.forEach(g => frag.appendChild(createCard(g)));
  grid.appendChild(frag);
  </script>
