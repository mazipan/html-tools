<!DOCTYPE html>
<!--
  TOOL TEMPLATE — copy this file to src/<slug>.html and replace all
  @@PLACEHOLDER@@ tokens. Then:
    1. Register the tool in src/tools.json (slug, name, icon, category, description, faqs).
    2. Run:  npm run generate:sections   (writes FAQ / more-tools / JSON-LD blocks)
             npm run generate:favicon    (rasterises the emoji icon to favicon-<slug>.png)
    3. Add a card for the tool in src/index.html under the appropriate section.
    4. If the tool needs bare-specifier npm imports, put the JS in a sibling
       src/<slug>.js and reference it via <script type="module" src="<slug>.js">.
       Otherwise keep all logic in the inline <script> at the bottom.
    5. Update AGENTS.md "Current tools" list and README.md tools table.

  See AGENTS.md "Adding a new tool" for the full checklist.
-->
<html lang="en">
<head>
  <include src="_partials/meta-base.html"></include>
  <title>@@TOOL NAME@@ — HTML Tools</title>
  <meta name="description" content="@@ONE-LINE DESCRIPTION. Runs in your browser, no tracking.@@">
  <link rel="canonical" href="https://tools.mazipan.space/@@SLUG@@">
  <meta property="og:title" content="@@TOOL NAME@@ — HTML Tools">
  <meta property="og:description" content="@@ONE-LINE DESCRIPTION. Runs in your browser, no tracking.@@">
  <meta property="og:url" content="https://tools.mazipan.space/@@SLUG@@">
  <meta name="twitter:title" content="@@TOOL NAME@@ — HTML Tools">
  <meta name="twitter:description" content="@@ONE-LINE DESCRIPTION. Runs in your browser, no tracking.@@">
  <include src="_partials/meta-social.html"></include>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-@@SLUG@@.png">
  <include src="_partials/head-fonts.html"></include>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Tool-specific styles go here. */
  </style>
  <include src="_partials/head-theme.html"></include>
  <!-- BEGIN:json-ld generated by scripts/generate-sections.mjs — re-run after editing tools.json -->
  <!-- END:json-ld -->
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">

  <header class="border-b border-gray-800 px-6 py-4">
    <nav aria-label="Breadcrumb" class="max-w-[@@MAX_WIDTH@@] mx-auto flex items-center gap-3">
      <a href="index.html" class="no-underline text-white font-bold text-lg tracking-tight hover:text-blue-400 transition-colors">
        HTML Tools
      </a>
      <span class="text-gray-700">/</span>
      <span class="text-gray-400 text-sm" aria-current="page">@@ICON@@ @@TOOL NAME@@</span>
    </nav>
  </header>

  <main class="max-w-[@@MAX_WIDTH@@] mx-auto w-full flex-1 py-8 px-6">

    <header class="mb-7">
      <h1 class="text-3xl font-bold text-white flex items-center gap-3">@@ICON@@ @@TOOL NAME@@</h1>
      <p class="mt-1.5 text-sm text-gray-500">@@SHORT SUBTITLE — one sentence describing what the tool does.@@</p>
    </header>

    <!-- ============================================================
         Tool UI goes here.
         Guidelines:
           - Use shared classes from styles.css first (.btn, .input, .select,
             .textarea, .chip, .card, .disclosure, .switch, .drop-zone, …).
           - Wrap groups of controls in a .toolbar for a flex options strip.
           - Use var(--accent) / var(--accent-h) for "active" colour, not hardcoded hex.
           - Exactly one <h1> per page (already above). Use <h2> for sections.
           - Heading order must not skip levels (h1 → h2 → h3).
         ============================================================ -->

  </main>

  <!--
    Script order — do NOT change:
      1. Optional: <script type="module" src="@@SLUG@@.js"></script>
         (only if the tool imports npm packages via bare specifiers)
      2. <include src="_partials/footer-script.html"></include>
      3. BEGIN:faq  …  END:faq       ← written by generate:sections
      4. BEGIN:more-tools … END:more-tools  ← written by generate:sections
      5. <footer>                    ← always last
      6. Inline <script> if no module (keep logic here for simple tools)
  -->

  <!-- (1) Uncomment if using a sibling .js module:
  <script type="module" src="@@SLUG@@.js"></script>
  -->

  <include src="_partials/footer-script.html"></include>

  <!-- BEGIN:faq generated by scripts/generate-sections.mjs — re-run after editing tools.json -->
  <!-- END:faq -->

  <!-- BEGIN:more-tools generated by scripts/generate-sections.mjs — re-run after editing tools.json -->
  <!-- END:more-tools -->

  <footer class="max-w-[@@MAX_WIDTH@@] mx-auto w-full py-8 px-6 border-t border-gray-800 text-center text-sm text-gray-600">
    <div>&copy; <span id="year"></span> <a href="https://mazipan.space" rel="noreferrer noopener" target="_blank" class="text-blue-400 transition-colors">Irfan Maulana</a> &amp; Claude</div>
    <div><span id="deploy-time"></span></div>
    <div><span id="commit-sha"></span><a href="https://github.com/mazipan/html-tools" rel="noreferrer noopener" target="_blank" class="text-blue-400 transition-colors">Source</a></div>
  </footer>

  <!-- (6) Inline script for tools with no npm imports. -->
  <script>
    // Tool logic here.
  </script>

</body>
</html>
