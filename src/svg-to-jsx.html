<!DOCTYPE html>
<html lang="en">
<head>
  <include src="_partials/meta-base.html"></include>
  <title>SVG to JSX — HTML Tools</title>
  <meta name="description" content="Convert SVG markup into React JSX-compatible code instantly in your browser.">
  <link rel="canonical" href="https://tools.mazipan.space/svg-to-jsx">
  <meta property="og:title" content="SVG to JSX — HTML Tools">
  <meta property="og:description" content="Convert SVG markup into React JSX-compatible code instantly in your browser.">
  <meta property="og:url" content="https://tools.mazipan.space/svg-to-jsx">
  <meta name="twitter:title" content="SVG to JSX — HTML Tools">
  <meta name="twitter:description" content="Convert SVG markup into React JSX-compatible code instantly in your browser.">
  <include src="_partials/meta-social.html"></include>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
  <include src="_partials/head-fonts.html"></include>
  <link rel="stylesheet" href="styles.css">
  <style>
    .jsx-tag     { color: #79c0ff; }
    .jsx-attr    { color: #c792ea; }
    .jsx-value   { color: #c3e88d; }
    .jsx-expr    { color: #f78c6c; }
    .jsx-punct   { color: #8b949e; }
    .jsx-comment { color: #6a737d; font-style: italic; }
    .jsx-keyword { color: #56b6c2; font-style: italic; }
    .jsx-fn      { color: #c792ea; }
    .jsx-import  { color: #c3e88d; }
  </style>
  <include src="_partials/head-theme.html"></include>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex flex-col">

  <header class="border-b border-gray-800 px-6 py-4">
    <div class="max-w-[1100px] mx-auto flex items-center gap-3">
      <a href="index.html" class="no-underline text-white font-bold text-lg tracking-tight hover:text-blue-400 transition-colors">
        HTML Tools
      </a>
      <span class="text-gray-700">/</span>
      <span class="text-gray-400 text-sm">⚛️ SVG to JSX</span>
    </div>
  </header>

  <div class="max-w-[1100px] mx-auto w-full flex-1 py-8 px-6">

    <header class="mb-7">
      <h1 class="text-3xl font-bold text-white flex items-center gap-3">⚛️ SVG to JSX</h1>
      <p class="mt-1.5 text-sm text-gray-500">Convert SVG markup into React JSX-compatible code.</p>
    </header>

    <!-- Options -->
    <div class="flex flex-wrap items-center gap-4 mb-4">
      <label class="flex items-center gap-2 text-xs text-gray-400 hover:text-gray-200 cursor-pointer select-none">
        <input type="checkbox" id="wrap-component" checked class="w-3.5 h-3.5 accent-blue-400 cursor-pointer">
        wrap in component
      </label>
      <div id="component-name-wrap" class="flex items-center gap-2">
        <label class="text-xs text-gray-500 font-medium">Name</label>
        <input id="component-name" type="text" value="MyIcon" spellcheck="false"
               class="px-2.5 py-1 rounded-md border border-gray-700 bg-gray-900 text-gray-200
                      text-sm w-24 outline-none focus:border-blue-400 transition-colors">
      </div>
      <label class="flex items-center gap-2 text-xs text-gray-400 hover:text-gray-200 cursor-pointer select-none" id="spread-label">
        <input type="checkbox" id="spread-props" checked class="w-3.5 h-3.5 accent-blue-400 cursor-pointer">
        spread {...props}
      </label>
      <label class="flex items-center gap-2 text-xs text-gray-400 hover:text-gray-200 cursor-pointer select-none">
        <input type="checkbox" id="remove-comments" checked class="w-3.5 h-3.5 accent-blue-400 cursor-pointer">
        remove comments
      </label>
      <label class="flex items-center gap-2 text-xs text-gray-400 hover:text-gray-200 cursor-pointer select-none">
        <input type="checkbox" id="use-svgo" class="w-3.5 h-3.5 accent-blue-400 cursor-pointer">
        optimize (SVGO)
      </label>
    </div>

    <div class="grid grid-cols-2 gap-4 max-md:grid-cols-1">

      <!-- Input -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">SVG Input</label>
          <span id="err-msg" class="text-xs text-red-400"></span>
        </div>
        <textarea id="input" placeholder="Paste SVG here..." spellcheck="false" oninput="onInput()"
                  class="w-full h-[500px] min-h-[500px] rounded-lg border border-gray-700 bg-gray-900
                         text-gray-200 font-mono text-[0.8rem] leading-relaxed p-4 resize-y outline-none
                         focus:border-blue-400 transition-colors"></textarea>
      </div>

      <!-- Output -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">JSX Output</label>
          <button onclick="copyOutput()" class="btn btn-secondary btn-sm">Copy</button>
        </div>
        <div id="output"
             class="w-full h-[500px] min-h-[500px] rounded-lg border border-gray-700 bg-gray-900
                    font-mono text-[0.8rem] leading-relaxed p-4 overflow-auto resize-y whitespace-pre"></div>
      </div>

    </div>

    <div id="status" class="mt-2.5 text-xs text-gray-500 min-h-[18px]"></div>

  </div>

  <footer class="max-w-[1100px] mx-auto w-full py-8 px-6 border-t border-gray-800 text-center text-sm text-gray-600">
    &copy; <span id="year"></span> Irfan Maulana &amp; Claude<br><span id="deploy-time"></span>
  </footer>

  <include src="_partials/footer-script.html"></include>
  <script>
    const inputEl  = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const errEl    = document.getElementById('err-msg');

    let lastOutput = '';

    // ── Options ───────────────────────────────────────────────────
    function getOptions() {
      return {
        wrapComponent:  document.getElementById('wrap-component').checked,
        componentName:  document.getElementById('component-name').value.trim() || 'MyIcon',
        spreadProps:    document.getElementById('spread-props').checked,
        removeComments: document.getElementById('remove-comments').checked,
        useSvgo:        document.getElementById('use-svgo').checked,
      };
    }

    // ── SVGO lazy loader ──────────────────────────────────────────
    let svgoOptimize = null;

    async function getSvgoOptimize() {
      if (svgoOptimize) return svgoOptimize;
      const mod = await new Function('u', 'return import(u)')('https://cdn.jsdelivr.net/npm/svgo@3/dist/svgo.browser.js');
      svgoOptimize = mod.optimize;
      return svgoOptimize;
    }

    document.getElementById('wrap-component').addEventListener('change', function () {
      document.getElementById('component-name-wrap').classList.toggle('hidden', !this.checked);
      document.getElementById('spread-label').classList.toggle('hidden', !this.checked);
      if (!this.checked) document.getElementById('spread-props').checked = false;
      convert();
    });

    // ── Attribute helpers ─────────────────────────────────────────
    // Attributes that are always stripped (xmlns namespace declarations)
    const STRIP_ATTRS = new Set(['xmlns', 'xmlns:xlink', 'xmlns:svg', 'xml:space', 'xml:lang']);

    const ATTR_REMAP = {
      'class':       'className',
      'for':         'htmlFor',
      'tabindex':    'tabIndex',
      'xlink:href':  'href',
      'xlink:title': 'xlinkTitle',
    };

    function toJsxAttrName(name) {
      if (STRIP_ATTRS.has(name))  return null;
      if (name in ATTR_REMAP)     return ATTR_REMAP[name];
      // Skip any remaining xmlns:* attributes
      if (name.startsWith('xmlns:')) return null;
      return name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    }

    function styleStringToJsx(styleStr) {
      const pairs = styleStr.split(';').map(s => s.trim()).filter(Boolean).map(entry => {
        const i    = entry.indexOf(':');
        const prop = entry.slice(0, i).trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase());
        const val  = entry.slice(i + 1).trim();
        return `${prop}: '${val}'`;
      });
      return `{${pairs.join(', ')}}`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Shorthand span builders for syntax highlighting
    const kw  = s => `<span class="jsx-keyword">${s}</span>`;
    const fn  = s => `<span class="jsx-fn">${escHtml(s)}</span>`;
    const p   = s => `<span class="jsx-punct">${s}</span>`;
    const a   = s => `<span class="jsx-attr">${s}</span>`;
    const ex  = s => `<span class="jsx-expr">${s}</span>`;
    const tag = s => `<span class="jsx-tag">${escHtml(s)}</span>`;
    const str = s => `<span class="jsx-import">${escHtml(s)}</span>`;

    // ── Node → lines ──────────────────────────────────────────────
    function buildAttrStr(el, opts, isSvgRoot) {
      const textParts = [];
      const htmlParts = [];

      // ref comes first on svg root when wrapping
      if (isSvgRoot && opts.wrapComponent) {
        textParts.push('ref={ref}');
        htmlParts.push(`${a('ref')}${p('={')}${ex('ref')}${p('}')}`);
      }

      for (const attr of el.attributes) {
        const jsxName = toJsxAttrName(attr.name);
        if (!jsxName) continue;

        if (jsxName === 'style') {
          const obj = styleStringToJsx(attr.value);
          textParts.push(`style={${obj}}`);
          htmlParts.push(`${a('style')}${p('={')}${ex(escHtml(obj))}${p('}')}`);
        } else {
          textParts.push(`${jsxName}="${attr.value}"`);
          htmlParts.push(`${a(escHtml(jsxName))}${p('="')}<span class="jsx-value">${escHtml(attr.value)}</span>${p('"')}`);
        }
      }

      if (isSvgRoot && opts.wrapComponent && opts.spreadProps) {
        textParts.push('{...props}');
        htmlParts.push(ex('{...props}'));
      }

      return { textParts, htmlParts };
    }

    function nodeToLines(node, depth, opts, isSvgRoot, textLines, htmlLines) {
      const ind     = '  '.repeat(depth);
      const attrInd = '  '.repeat(depth + 1);

      if (node.nodeType === 3) {
        const text = node.textContent.trim();
        if (text) { textLines.push(ind + text); htmlLines.push(ind + escHtml(text)); }
        return;
      }

      if (node.nodeType === 8) {
        if (opts.removeComments) return;
        const txt = node.textContent.trim();
        textLines.push(`${ind}{/* ${txt} */}`);
        htmlLines.push(`${ind}<span class="jsx-comment">{/* ${escHtml(txt)} */}</span>`);
        return;
      }

      if (node.nodeType !== 1) return;

      const tagName = node.tagName;
      const { textParts, htmlParts } = buildAttrStr(node, opts, isSvgRoot);

      const children = [...node.childNodes].filter(n => {
        if (n.nodeType === 3 && !n.textContent.trim()) return false;
        if (n.nodeType === 8 && opts.removeComments)   return false;
        return true;
      });

      const multiline = textParts.length >= 2;

      if (multiline) {
        // Opening tag line
        textLines.push(`${ind}<${tagName}`);
        htmlLines.push(`${ind}${p('&lt;')}${tag(tagName)}`);
        // One attribute per line
        textParts.forEach((t, i) => { textLines.push(`${attrInd}${t}`);     htmlLines.push(`${attrInd}${htmlParts[i]}`); });
        // Closing bracket
        if (children.length === 0) {
          textLines.push(`${ind}/>`);
          htmlLines.push(`${ind}${p('/&gt;')}`);
        } else {
          textLines.push(`${ind}>`);
          htmlLines.push(`${ind}${p('&gt;')}`);
          for (const child of children) nodeToLines(child, depth + 1, opts, false, textLines, htmlLines);
          textLines.push(`${ind}</${tagName}>`);
          htmlLines.push(`${ind}${p('&lt;/')}${tag(tagName)}${p('&gt;')}`);
        }
      } else {
        const attrT = textParts.length ? ' ' + textParts[0] : '';
        const attrH = htmlParts.length ? ' ' + htmlParts[0] : '';
        if (children.length === 0) {
          textLines.push(`${ind}<${tagName}${attrT} />`);
          htmlLines.push(`${ind}${p('&lt;')}${tag(tagName)}${attrH} ${p('/&gt;')}`);
        } else {
          textLines.push(`${ind}<${tagName}${attrT}>`);
          htmlLines.push(`${ind}${p('&lt;')}${tag(tagName)}${attrH}${p('&gt;')}`);
          for (const child of children) nodeToLines(child, depth + 1, opts, false, textLines, htmlLines);
          textLines.push(`${ind}</${tagName}>`);
          htmlLines.push(`${ind}${p('&lt;/')}${tag(tagName)}${p('&gt;')}`);
        }
      }
    }

    // ── Convert ───────────────────────────────────────────────────
    async function convert() {
      const raw = inputEl.value.trim();
      errEl.textContent = '';
      inputEl.classList.remove('border-red-500');

      if (!raw) { outputEl.innerHTML = ''; lastOutput = ''; setStatus(''); return; }

      let cleaned = raw.replace(/<\?xml[^?]*\?>/g, '').replace(/<!DOCTYPE[^>]*>/gi, '').trim();

      const opts = getOptions();

      if (opts.useSvgo) {
        try {
          setStatus('Optimizing…');
          const optimize = await getSvgoOptimize();
          const result = optimize(cleaned, { multipass: true });
          cleaned = result.data;
        } catch (e) {
          errEl.textContent = 'SVGO: ' + e.message;
          inputEl.classList.add('border-red-500');
          outputEl.innerHTML = '';
          lastOutput = '';
          return;
        }
      }

      let doc;
      try {
        doc = new DOMParser().parseFromString(cleaned, 'image/svg+xml');
        const pe = doc.querySelector('parsererror');
        if (pe) throw new Error(pe.textContent.split('\n')[0].trim());
      } catch (e) {
        errEl.textContent = e.message;
        inputEl.classList.add('border-red-500');
        outputEl.innerHTML = '';
        lastOutput = '';
        return;
      }

      const svgEl = doc.querySelector('svg');
      if (!svgEl) { errEl.textContent = 'No <svg> element found'; return; }

      const svgText   = [];
      const svgHtml   = [];

      nodeToLines(svgEl, 0, opts, true, svgText, svgHtml);

      let finalText, finalHtml;

      if (opts.wrapComponent) {
        const name = opts.componentName;

        finalText = [
          `import { forwardRef } from 'react';`,
          `import type { SVGProps } from 'react';`,
          ``,
          `export const ${name} = forwardRef<SVGSVGElement, SVGProps<SVGSVGElement>>(`,
          `  (props, ref) => (`,
          ...svgText.map(l => '    ' + l),
          `  )`,
          `);`,
          ``,
          `${name}.displayName = '${name}';`,
        ];

        finalHtml = [
          `${kw('import')} ${p('{')} ${a('forwardRef')} ${p('}')} ${kw('from')} ${str("'react';")}`,
          `${kw('import')} ${kw('type')} ${p('{')} ${a('SVGProps')} ${p('}')} ${kw('from')} ${str("'react';")}`,
          ``,
          `${kw('export')} ${kw('const')} ${fn(name)} ${p('=')} ${a('forwardRef')}${p('<')}${ex('SVGSVGElement')}, ${ex('SVGProps&lt;SVGSVGElement&gt;')}${p('>(')  }`,
          `  ${p('(')}${a('props')}, ${a('ref')}${p(')')} ${p('=>')} ${p('(')}`,
          ...svgHtml.map(l => '    ' + l),
          `  ${p(')')}`,
          `${p(');')}`,
          ``,
          `${fn(name)}${p('.')}${a('displayName')} ${p('=')} ${str("'" + name + "';")}`,
        ];
      } else {
        finalText = svgText;
        finalHtml = svgHtml;
      }

      lastOutput = finalText.join('\n');

      const pad = String(finalHtml.length).length;
      let lineNum = 1;
      const rendered = finalHtml.map(line => {
        const num = line === '' ? ' '.repeat(pad) : String(lineNum++).padStart(pad);
        return `<span class="line-num">${num}</span>${line}`;
      }).join('\n');

      outputEl.innerHTML = rendered;

      const elCount = doc.querySelectorAll('*').length;
      setStatus(`Converted · ${elCount} element${elCount !== 1 ? 's' : ''}`, 'ok');
    }

    function copyOutput() {
      if (!lastOutput) return;
      navigator.clipboard.writeText(lastOutput).then(() => {
        setStatus('Copied!', 'ok');
        setTimeout(() => convert(), 2000);
      });
    }

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className   = type === 'ok'
        ? 'mt-2.5 text-xs min-h-[18px] text-green-400'
        : type === 'err'
          ? 'mt-2.5 text-xs min-h-[18px] text-red-400'
          : 'mt-2.5 text-xs min-h-[18px] text-gray-500';
    }

    let timer;
    function onInput() { clearTimeout(timer); timer = setTimeout(convert, 300); }

    document.getElementById('remove-comments').addEventListener('change', convert);
    document.getElementById('use-svgo').addEventListener('change', convert);
    document.getElementById('spread-props').addEventListener('change', convert);
    document.getElementById('component-name').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(convert, 200); });

    inputEl.focus();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
