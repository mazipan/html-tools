  <text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="800" fill="#ffffff">HTML Tools</text>
  <text x="80" y="380" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#9ca3af">Browser-native utilities for developers</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" fill="#e5e7eb">
