name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@735343b667b4b3e6e46c4ce7e90f2b42b4f7a14e # v2.0.2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx biome ci --linter-enabled=false --assist-enabled=false
